<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-labelledby="interop-diagram-title interop-diagram-desc" style="display:block; background:#fff8ed; font-family: &quot;JetBrains Mono&quot;, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <title id="interop-diagram-title">gpui_interop versus gpui-fast native composition</title>
  <desc id="interop-diagram-desc">Left: gpui_interop imports an external GPU producer's texture into GPUI's normal scene, where GPUI samples and composites it. Right: gpui-fast stacks a native child surface and a GPUI overlay surface, leaving compositing to the OS window compositor.</desc>
  <defs>
    <marker id="arrow-ocean" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#378fbd" />
    </marker>
  </defs>

  <!-- Warm card frame, matching the site's sand/paper surfaces. -->
  <rect x="0.75" y="0.75" width="918.5" height="438.5" rx="10" fill="#fff8ed" stroke="#dde1e3" stroke-width="1.5" />

  <!-- ================= LEFT PANEL: gpui_interop ================= -->
  <rect x="20" y="20" width="430" height="400" rx="8" fill="#ffffff" stroke="#dde1e3" stroke-width="1.5" />
  <path d="M28 20 H442 A8 8 0 0 1 450 28 V72 H20 V28 A8 8 0 0 1 28 20 Z" fill="#fae0b7" stroke="#dde1e3" stroke-width="1.5" />
  <text x="40" y="46" fill="#174d68" font-size="16" font-weight="700">gpui_interop</text>
  <text x="40" y="64" fill="#5b6368" font-size="11">Just a normal GPUI element inside GPUI's scene</text>

  <!-- External GPU producer -->
  <rect x="40" y="95" width="390" height="54" rx="6" fill="#eaf4fa" stroke="#378fbd" stroke-width="1.5" />
  <text x="55" y="118" fill="#1e6b98" font-size="12.5" font-weight="700">External GPU Producer (Vulkan / wgpu / Bevy)</text>
  <text x="55" y="136" fill="#5b6368" font-size="10">Renders to a GPU image → exports dma-buf / D3D handle + fence</text>

  <!-- Handoff arrow -->
  <line x1="235" y1="149" x2="235" y2="252" stroke="#378fbd" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-ocean)" />
  <rect x="135" y="162" width="200" height="20" rx="4" fill="#fff8ed" stroke="#dde1e3" />
  <text x="235" y="176" fill="#1e6b98" font-size="10" text-anchor="middle">Zero-copy GPU texture handle</text>

  <!-- GPUI window: one scene -->
  <rect x="40" y="195" width="390" height="205" rx="6" fill="#fffdfa" stroke="#dde1e3" stroke-width="1.5" />
  <text x="55" y="216" fill="#174d68" font-size="12" font-weight="700">GPUI Window (Single Scene / Normal Layout Tree)</text>

  <!-- Sidebar -->
  <rect x="55" y="230" width="95" height="155" rx="4" fill="#ffffff" stroke="#dde1e3" />
  <text x="65" y="250" fill="#5b6368" font-size="10.5">div()</text>
  <rect x="65" y="262" width="75" height="18" rx="3" fill="#f7f1e5" stroke="#dde1e3" />
  <text x="72" y="275" fill="#174d68" font-size="10">Sidebar</text>
  <rect x="65" y="286" width="75" height="18" rx="3" fill="#f7f1e5" stroke="#dde1e3" />
  <text x="72" y="299" fill="#174d68" font-size="10">Scene Tree</text>

  <!-- Main content -->
  <rect x="160" y="230" width="255" height="155" rx="4" fill="#ffffff" stroke="#dde1e3" />
  <text x="170" y="248" fill="#5b6368" font-size="10.5">div() (Flex Container)</text>

  <!-- surface() is an ordinary element in the scene. -->
  <rect x="172" y="258" width="231" height="115" rx="4" fill="#eaf4fa" stroke="#378fbd" stroke-width="2" />
  <text x="182" y="276" fill="#1e6b98" font-size="12" font-weight="700">surface() element</text>
  <text x="182" y="292" fill="#1e6b98" font-size="10">Sampled directly by GPUI renderer</text>

  <!-- GPUI controls paint over the imported texture. -->
  <rect x="184" y="335" width="85" height="26" rx="4" fill="#cb3b1b" stroke="#cb3b1b" />
  <text x="226" y="352" fill="#ffffff" font-size="10.5" text-anchor="middle">div() Button</text>

  <rect x="278" y="335" width="112" height="26" rx="4" fill="#fae0b7" stroke="#dde1e3" />
  <text x="334" y="352" fill="#174d68" font-size="10.5" text-anchor="middle">HUD Overlay</text>

  <!-- ================= RIGHT PANEL: gpui-fast ================= -->
  <rect x="470" y="20" width="430" height="400" rx="8" fill="#ffffff" stroke="#dde1e3" stroke-width="1.5" />
  <path d="M478 20 H892 A8 8 0 0 1 900 28 V72 H470 V28 A8 8 0 0 1 478 20 Z" fill="#fae0b7" stroke="#dde1e3" stroke-width="1.5" />
  <text x="490" y="46" fill="#174d68" font-size="16" font-weight="700">gpui-fast native composition</text>
  <text x="490" y="64" fill="#5b6368" font-size="11">Separate OS surfaces stacked by the compositor</text>

  <!-- Layer 1: GPUI overlay surface -->
  <rect x="490" y="95" width="390" height="78" rx="6" fill="#fdeee9" stroke="#ef4e28" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="505" y="116" fill="#cb3b1b" font-size="12" font-weight="700">1. GPUI Overlay Subsurface (Top OS Layer)</text>
  <text x="505" y="133" fill="#5b6368" font-size="10">Separate transparent surface so menus stay above WebView</text>
  <rect x="505" y="142" width="110" height="22" rx="3" fill="#fae0b7" stroke="#ef4e28" />
  <text x="560" y="157" fill="#cb3b1b" font-size="10" text-anchor="middle">Dropdown Menu</text>
  <rect x="625" y="142" width="95" height="22" rx="3" fill="#fae0b7" stroke="#ef4e28" />
  <text x="672" y="157" fill="#cb3b1b" font-size="10" text-anchor="middle">Popover HUD</text>

  <!-- Layer 2: native child surface -->
  <rect x="490" y="195" width="390" height="90" rx="6" fill="#fdeee9" stroke="#ef4e28" stroke-width="1.5" />
  <text x="505" y="218" fill="#cb3b1b" font-size="12" font-weight="700">2. Native Child Subsurface (WebView / OS Widget)</text>
  <text x="505" y="236" fill="#5b6368" font-size="10.5">• Foreign stack owns its own pixels &amp; presentation</text>
  <text x="505" y="253" fill="#5b6368" font-size="10.5">• GPUI renderer never sees or samples these pixels</text>
  <text x="505" y="270" fill="#5b6368" font-size="10.5">• Receives OS scroll, input, and accessibility directly</text>

  <!-- Layer 3: the ordinary GPUI window -->
  <rect x="490" y="307" width="390" height="93" rx="6" fill="#ffffff" stroke="#dde1e3" stroke-width="1.5" />
  <text x="505" y="330" fill="#174d68" font-size="12" font-weight="700">3. GPUI Top-Level Window (Base OS Layer)</text>
  <text x="505" y="348" fill="#5b6368" font-size="10.5">Normal GPUI chrome, sidebars, and tabs around the hole</text>
  <rect x="505" y="360" width="360" height="26" rx="4" fill="#f7f1e5" stroke="#dde1e3" />
  <text x="685" y="377" fill="#5b6368" font-size="10.5" text-anchor="middle">OS Window Compositor merges layers 1 + 2 + 3</text>
</svg>
