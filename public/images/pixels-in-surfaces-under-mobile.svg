<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 860" width="360" height="860" role="img" aria-labelledby="interop-diagram-mobile-title interop-diagram-mobile-desc" style="display:block; background:#fff8ed; font-family: &quot;JetBrains Mono&quot;, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <title id="interop-diagram-mobile-title">gpui_interop versus gpui-fast native composition</title>
  <desc id="interop-diagram-mobile-desc">Stacked mobile diagram. Top: gpui_interop imports an external GPU producer's texture into GPUI's normal scene, where GPUI samples and composites it. Bottom: gpui-fast stacks a native child surface and a GPUI overlay surface, leaving compositing to the OS window compositor.</desc>
  <defs>
    <marker id="arrow-ocean-mobile" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#378fbd" />
    </marker>
  </defs>

  <!-- Warm card frame, matching the site's sand/paper surfaces. -->
  <rect x="0.75" y="0.75" width="358.5" height="858.5" rx="10" fill="#fff8ed" stroke="#dde1e3" stroke-width="1.5" />

  <!-- ================= TOP PANEL: gpui_interop ================= -->
  <rect x="12" y="16" width="336" height="420" rx="8" fill="#ffffff" stroke="#dde1e3" stroke-width="1.5" />
  <path d="M20 16 H340 A8 8 0 0 1 348 24 V60 H12 V24 A8 8 0 0 1 20 16 Z" fill="#fae0b7" stroke="#dde1e3" stroke-width="1.5" />
  <text x="26" y="38" fill="#174d68" font-size="17" font-weight="700">gpui_interop</text>
  <text x="26" y="54" fill="#5b6368" font-size="11">Just a normal GPUI element inside GPUI's scene</text>

  <!-- External GPU producer -->
  <rect x="24" y="72" width="312" height="56" rx="6" fill="#eaf4fa" stroke="#378fbd" stroke-width="1.5" />
  <text x="36" y="90" fill="#1e6b98" font-size="12" font-weight="700">External GPU Producer</text>
  <text x="36" y="104" fill="#1e6b98" font-size="10">Vulkan / wgpu / Bevy</text>
  <text x="36" y="119" fill="#5b6368" font-size="9.5">Renders on its own GPU → exports image + fence</text>

  <!-- Handoff arrow -->
  <line x1="180" y1="128" x2="180" y2="158" stroke="#378fbd" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-ocean-mobile)" />
  <rect x="100" y="134" width="160" height="18" rx="4" fill="#ffffff" stroke="#dde1e3" />
  <text x="180" y="147" fill="#1e6b98" font-size="9.5" text-anchor="middle">Zero-copy texture handle</text>

  <!-- GPUI window: one scene -->
  <rect x="24" y="160" width="312" height="260" rx="6" fill="#f7f1e5" stroke="#dde1e3" stroke-width="1.5" />
  <text x="36" y="181" fill="#174d68" font-size="12" font-weight="700">GPUI Window (Single Scene)</text>

  <!-- Sidebar -->
  <rect x="36" y="194" width="86" height="180" rx="4" fill="#ffffff" stroke="#dde1e3" />
  <text x="44" y="212" fill="#5b6368" font-size="10.5">div()</text>
  <rect x="44" y="220" width="70" height="18" rx="3" fill="#fae0b7" stroke="#dde1e3" />
  <text x="51" y="233" fill="#174d68" font-size="9.5">Sidebar</text>
  <rect x="44" y="244" width="70" height="18" rx="3" fill="#fae0b7" stroke="#dde1e3" />
  <text x="51" y="257" fill="#174d68" font-size="9.5">Scene Tree</text>

  <!-- Main content -->
  <rect x="130" y="194" width="194" height="180" rx="4" fill="#ffffff" stroke="#dde1e3" />
  <text x="138" y="210" fill="#5b6368" font-size="10.5">div() (Flex Container)</text>

  <!-- surface() is an ordinary element in the scene. -->
  <rect x="138" y="218" width="178" height="100" rx="4" fill="#eaf4fa" stroke="#378fbd" stroke-width="2" />
  <text x="146" y="236" fill="#1e6b98" font-size="11.5" font-weight="700">surface() element</text>
  <text x="146" y="251" fill="#1e6b98" font-size="9.5">Sampled by GPUI</text>
  <rect x="146" y="262" width="82" height="24" rx="4" fill="#cb3b1b" />
  <text x="187" y="278" fill="#ffffff" font-size="9.5" text-anchor="middle">div() Button</text>
  <rect x="236" y="262" width="72" height="24" rx="4" fill="#fae0b7" stroke="#dde1e3" />
  <text x="272" y="278" fill="#174d68" font-size="9.5" text-anchor="middle">HUD</text>

  <text x="36" y="396" fill="#5b6368" font-size="10.5">GPUI paints its controls over the texture.</text>

  <!-- ================= BOTTOM PANEL: gpui-fast ================= -->
  <rect x="12" y="452" width="336" height="392" rx="8" fill="#ffffff" stroke="#dde1e3" stroke-width="1.5" />
  <path d="M20 452 H340 A8 8 0 0 1 348 460 V496 H12 V460 A8 8 0 0 1 20 452 Z" fill="#fae0b7" stroke="#dde1e3" stroke-width="1.5" />
  <text x="26" y="474" fill="#174d68" font-size="17" font-weight="700">gpui-fast native composition</text>
  <text x="26" y="490" fill="#5b6368" font-size="11">Separate OS surfaces stacked by the compositor</text>

  <!-- Layer 1: GPUI overlay surface -->
  <rect x="24" y="508" width="312" height="84" rx="6" fill="#fdeee9" stroke="#ef4e28" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="36" y="530" fill="#cb3b1b" font-size="12" font-weight="700">1. GPUI Overlay Subsurface</text>
  <text x="36" y="546" fill="#5b6368" font-size="10">Top OS layer · menus above the WebView</text>
  <rect x="36" y="556" width="108" height="22" rx="3" fill="#fae0b7" stroke="#ef4e28" />
  <text x="90" y="571" fill="#cb3b1b" font-size="9.5" text-anchor="middle">Dropdown Menu</text>
  <rect x="152" y="556" width="100" height="22" rx="3" fill="#fae0b7" stroke="#ef4e28" />
  <text x="202" y="571" fill="#cb3b1b" font-size="9.5" text-anchor="middle">Popover HUD</text>

  <!-- Layer 2: native child surface -->
  <rect x="24" y="604" width="312" height="100" rx="6" fill="#f7f1e5" stroke="#ef4e28" stroke-width="1.5" />
  <text x="36" y="626" fill="#cb3b1b" font-size="11.5" font-weight="700">2. Native Child Subsurface (WebView)</text>
  <text x="36" y="644" fill="#5b6368" font-size="10.5">• Owns its pixels and presentation</text>
  <text x="36" y="662" fill="#5b6368" font-size="10.5">• GPUI never samples these pixels</text>
  <text x="36" y="680" fill="#5b6368" font-size="10.5">• Receives OS input and accessibility</text>

  <!-- Layer 3: the ordinary GPUI window -->
  <rect x="24" y="718" width="312" height="104" rx="6" fill="#ffffff" stroke="#dde1e3" stroke-width="1.5" />
  <text x="36" y="740" fill="#174d68" font-size="12" font-weight="700">3. GPUI Top-Level Window</text>
  <text x="36" y="758" fill="#5b6368" font-size="10.5">Base OS layer · chrome around the hole</text>
  <rect x="36" y="770" width="288" height="26" rx="4" fill="#f7f1e5" stroke="#dde1e3" />
  <text x="180" y="787" fill="#5b6368" font-size="10.5" text-anchor="middle">OS Window Compositor merges layers 1 + 2 + 3</text>
</svg>
